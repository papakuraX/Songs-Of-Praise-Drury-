<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Songs Of Praise In Times Of War - Drury Church Choir Class Space</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #070a12;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-gold: #dfb44c;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f9fafb;
            --text-dim: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            background: radial-gradient(circle at top right, #111a2e, #070a12);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Identity Setup & Voice Match Panel */
        .setup-box {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .voice-match-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 6px;
        }
        .match-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-glass);
            color: var(--text-dim);
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .match-btn.active {
            background: linear-gradient(135deg, rgba(223,180,76,0.15), rgba(0,0,0,0));
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* YouTube Processing Feature */
        .feature-box {
            background: rgba(16, 185, 129, 0.03);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-action {
            background: var(--accent-green);
            color: #070a12;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Teleprompter Lyrics System */
        .lyric-teleprompter {
            background: #000;
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .lyric-timer {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 0.65rem;
            color: var(--accent-gold);
            font-family: monospace;
            font-weight: bold;
        }
        .lyric-line {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.3s;
        }
        .lyric-sub {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Mix Workspace Deck */
        .mixer-deck {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .deck-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .slider-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 90px;
        }
        .slider-title {
            font-size: 0.75rem;
            font-weight: 600;
        }
        .toggle-switch {
            background: none;
            border: 1px solid var(--border-glass);
            color: var(--text-light);
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            min-width: 55px;
        }
        .toggle-switch.muted {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
        }

        /* 24-Slot Multi-Track Grid */
        .section-label {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .roster-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            margin-top: 16px;
        }
        .next-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }
        .indicator-dot.ready {
            background-color: var(--accent-green) !important;
            box-shadow: 0 0 8px var(--accent-green) !important;
        }

        .live-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 6px;
            background: rgba(0,0,0,0.1);
        }
        .live-grid::-webkit-scrollbar { width: 4px; }
        .live-grid::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 4px; }

        .vocal-row {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .vocal-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slot-pill {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-dim);
            font-family: monospace;
        }
        .singer-tag {
            font-size: 0.75rem;
            font-weight: 600;
        }
        .rec-btn {
            background: none;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .rec-btn.recording {
            background: var(--accent-red);
            color: #fff;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* Church History Chronicles Section */
        .history-section {
