<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Songs Of Praise In Times Of War - Drury Church Choir Class Space</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Premium Non-Black Million-Dollar Studio Palette */
            --bg-gradient-top: #14532d;    /* Deep Emerald/Forest Moss */
            --bg-gradient-bottom: #064e3b; /* Luxurious Deep Teal Slate */
            --card-glass: rgba(251, 191, 36, 0.08); /* Frosted Amber Tint */
            --border-glass: rgba(251, 191, 36, 0.2);
            --accent-gold: #f59e0b;
            --accent-gold-glow: #fde047;   /* Radiant Polished Gold */
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #f1f5f9;
            --input-bg: rgba(6, 78, 59, 0.6); /* Velvet Emerald Input Base */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-top), var(--bg-gradient-bottom));
            color: var(--text-light);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 35px 70px -15px rgba(2, 44, 34, 0.6), inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(25px);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, var(--accent-gold-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .app-navigation {
            display: flex;
            background: rgba(4, 47, 31, 0.5);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            gap: 4px;
        }
        .nav-tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 10px 0;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .nav-tab.active {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(0,0,0,0));
            border: 1px solid var(--border-glass);
            color: var(--accent-gold-glow);
        }

        .page-content {
            display: none;
        }
        .page-content.active {
            display: block;
        }

        .feature-box {
            background: rgba(251, 191, 36, 0.05);
            border: 1px solid rgba(251, 191, 36, 0.25);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-gold-glow);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: var(--accent-gold-glow);
        }
        .btn-action {
            background: linear-gradient(90deg, var(--accent-gold), #d97706);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
        }

        /* Diagnostic Vocal Range Tester Spaces */
        .tester-display {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
        }
        .pitch-meter {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-gold-glow);
            margin: 6px 0;
        }
        .range-suggestion-box {
            font-size: 0.75rem;
            color: var(--text-dim);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            display: none;
        }
        .assign-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .btn-assign-choice {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        .scanner-feedback-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--accent-green);
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px;
            font-size: 0.72rem;
            line-height: 1.4;
            display: none;
        }
        .scanner-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 6px;
            display: none;
            overflow: hidden;
        }
        .scanner-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-green);
        }

        .lyric-teleprompter {
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 16px;
            position: relative;
        }
        .lyric-timer {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 0.65rem;
            color: var(--accent-gold-glow);
            font-family: monospace;
            font-weight: bold;
        }
        .lyric-line {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-light);
        }
        .lyric-sub {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 4px;
            opacity: 0.8;
        }

        .mixer-deck {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .deck-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-gold-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            background: rgba(4, 47, 31, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .slider-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-title {
            font-size: 0.75rem;
            font-weight: 600;
        }
        .toggle-switch {
            background: none;
            border: 1px solid var(--border-glass);
            color: var(--text-light);
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            min-width: 55px;
        }
        .toggle-switch.muted {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-gold-glow);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .roster-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            margin-top: 16px;
        }
